  --accent:#FF7A60; --accent-ink:#1A0E0B; --focus:#5CB8EA; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--w1) linear-gradient(180deg,var(--w1) 0,var(--w1) 300px,var(--w2) 100%) no-repeat;color:var(--ink);font:14px/1.45 var(--body);padding-inline:16px;padding-block:12px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
body::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--sceneh);background:var(--scene) 30% bottom/cover no-repeat;z-index:-1;pointer-events:none}
body::after{content:"";position:fixed;left:0;top:var(--sceneh);bottom:0;width:calc(100% + 240px);background:var(--ripples) 0 0/240px 60px repeat;opacity:var(--rip-o);z-index:-1;pointer-events:none;animation:drift 38s linear infinite}
@keyframes drift{to{transform:translateX(-240px)}}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.gl{width:1em;height:1em;display:block;flex:none}

#app{height:100%;min-height:560px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;max-width:1500px;margin-inline:auto}

/* header */
.top{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div:last-child{min-width:0}
.mark{width:36px;height:36px;border-radius:11px;background:var(--water-deep);display:grid;place-items:center;color:#fff;flex:none}
.mark svg{width:22px;height:22px}
.brand h1{font-size:21px;font-weight:800;line-height:1.05;color:var(--head)}
.brand small{display:block;color:var(--head-sub);font-size:12px;margin-top:2px;max-width:146px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockup{padding-bottom:32px}
.th{position:relative;display:inline-block}
.badger{position:absolute;top:calc(100% - 2px);left:50%;transform:translateX(-50%);width:1.7em;height:1.3em;pointer-events:none;overflow:visible}
.spacer{flex:1}
.viewer{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12.5px;max-width:100%}
.viewer img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--field)}
.viewer b{font-weight:700}
.viewer span{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#2E9E6B;flex:none}
.dot.off{background:#B58A2E}

/* toolbar */
.tools{min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 4px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px 5px 5px;white-space:nowrap;font-weight:500;font-size:13px}
.chip .bd{width:22px;height:22px;border-radius:50%;background:var(--c,var(--muted));color:#fff;display:grid;place-items:center;font-size:13px}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.chip.off{opacity:.5}
.chip.off .bd{background:var(--line);color:var(--muted)}
.chip.all{padding-left:12px}
.search{flex:0 0 240px;position:relative;min-width:0}
.search input{-webkit-appearance:none;appearance:none;width:100%;height:38px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px 0 34px}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#B3261E;border-color:currentColor;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{height:32px;padding:0 12px;font-size:13px}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:16px;min-height:0}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:var(--land);border:1px solid var(--line);min-height:0;box-shadow:var(--shadow)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.placing #map{cursor:crosshair}
.land{fill:var(--land)}
.ringp{fill:none;stroke:var(--ring);stroke-width:1.1;stroke-linejoin:round}
.shore{fill:var(--water);stroke:var(--shore);stroke-width:1.4;stroke-linejoin:round;fill-rule:evenodd}
.deep{fill:var(--water-deep);fill-rule:evenodd;opacity:.75}
.deep2{fill:color-mix(in srgb,var(--water-deep) 70%,#001d3d);fill-rule:evenodd;opacity:.55}
.names{pointer-events:none}
#app[data-names="0"] .names,#app[data-names="0"] .poi-l{display:none}
.ls .cove{font-style:italic;font-weight:500;font-size:9.4px;fill:var(--water-text);stroke:color-mix(in srgb,var(--land) 45%,var(--water));stroke-width:2.6px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;letter-spacing:.01em}
.ls .cove.t1{font-size:10.6px;font-weight:600}
.ls .cove.t3{font-size:8.7px}
.poi{cursor:pointer;outline:none}
.poi:focus-visible .poi-b{stroke:var(--focus);stroke-width:2.8px}
.ls .poi-b{fill:#0E5A80;stroke:#fff;stroke-width:1.4px}
.poi.ramp .poi-b{fill:#1C8A6E}
.poi.park .poi-b{fill:#7A5A1E}
.ls .poi-g{fill:none;stroke:#fff;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.ls .poi-h{fill:transparent;stroke:none}
.ls .poi-t{font-size:9.6px;font-weight:600;fill:var(--map-text);stroke:var(--land);stroke-width:3.2px}
.mapctl button#zname{font-weight:800;font-size:13px;letter-spacing:-.03em}
.poicard{position:absolute;left:12px;top:12px;z-index:4;max-width:min(360px,calc(100% - 76px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 8px 10px 14px;display:flex;gap:10px;align-items:flex-start}
.poicard .pct{min-width:0;display:flex;flex-direction:column;gap:2px}
.poicard .pk{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.poicard b{font-size:15px;line-height:1.25;text-wrap:balance}
.poicard span.pw{font-size:12.5px;color:var(--muted)}
.poicard p{margin:3px 0 0;font-size:12.5px;line-height:1.4}
.poicard .pfoot{margin-top:4px;font-size:11px;color:var(--muted)}
.poicard button{flex:none;width:30px;height:30px;border:0;background:transparent;border-radius:8px;font-size:20px;line-height:1;color:var(--muted)}
.poicard button:hover{background:var(--field)}
.maptitle{font-family:var(--display);font-weight:800;fill:var(--map-text);opacity:.55;letter-spacing:.16em}
.mapsub{font-family:var(--body);font-weight:500;fill:var(--map-text);opacity:.6;letter-spacing:.06em}
.lk{font-family:var(--body);font-weight:700;fill:#fff;opacity:.7;letter-spacing:.4em;text-transform:uppercase}
.ls text{font-family:var(--body);font-weight:700;fill:var(--map-text);paint-order:stroke;stroke:var(--land);stroke-width:3.2px;stroke-linejoin:round;font-size:11px}
.ls .water{font-style:italic;font-weight:500;fill:var(--water-text);stroke:none;font-size:10.5px}
.ls .place{font-size:10px;font-weight:500;letter-spacing:.02em}
.ls .tdot{fill:var(--map-text)}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin:focus-visible .pbody{stroke:var(--focus);stroke-width:3}
.pbody{stroke:#fff;stroke-width:2;paint-order:stroke;filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.35))}
.pin.sample .pbody{fill-opacity:.82}
.pin .plabel{font:700 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.2px;stroke-linejoin:round;display:none}
svg[data-hi="1"] .pin .plabel,.pin.sel .plabel{display:block}
.gshadow{fill:rgba(0,0,0,.28)}
.draft .pbody{stroke-dasharray:4 3;stroke:var(--ink)}
.pulse{fill:none;stroke:var(--accent);stroke-width:2;transform-origin:0 0;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}

.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.mapctl button{width:38px;height:38px;border:0;background:transparent;font-size:20px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.mapctl button+button{border-top:1px solid var(--line)}
.mapctl svg{width:18px;height:18px}
.fullback{display:none;position:absolute;left:12px;top:12px;z-index:5;height:38px;padding:0 16px 0 10px;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.fullback svg{width:18px;height:18px}
#app[data-full="1"] .fullback{display:flex}
#app[data-full="1"] .north{top:60px}
#app[data-full="1"] .toast{bottom:76px}
.fullcard{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;max-width:min(440px,calc(100% - 210px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px 8px 8px 14px}
.fullcard .fct{min-width:0;display:flex;flex-direction:column}
.fullcard b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fullcard span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.mapfull,html.mapfull body{overflow:hidden}
#app[data-full="1"] .mapwrap{position:fixed;inset:0;z-index:70;border-radius:0;border:0;box-shadow:none}
#app[data-full="1"] .mapctl button#zfull{background:var(--ink);color:var(--bg)}
@media (orientation:portrait) and (max-width:899px){
  #app[data-full="1"] .mapwrap{inset:auto;left:0;top:0;width:var(--fh,100vh);height:var(--fw,100vw);transform-origin:0 0;transform:translateX(var(--fw,100vw)) rotate(90deg)}
}
.me{pointer-events:none}
.avpick{position:absolute;right:58px;top:12px;z-index:4;width:min(236px,calc(100% - 78px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 10px 8px}
.avpick .avt{margin:0 4px 6px;font:800 14px var(--display);letter-spacing:-.01em}
.avb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:3px 8px 3px 4px;font-weight:500}
.avb:hover{background:var(--field)}
.avb[aria-pressed="true"]{border-color:#E0A800;background:color-mix(in srgb,#FFD21F 20%,var(--card));font-weight:700}
.avb svg{width:46px;height:32px;flex:none;display:block;background:color-mix(in srgb,var(--water) 40%,var(--card));border-radius:8px}
.mapctl button#zedit[aria-expanded="true"]{background:var(--field)}
.me-acc{fill:rgba(255,210,31,.18);stroke:#D9A400;stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.me-bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.2px)}}
.mapctl button#zloc[aria-pressed="false"]{color:var(--ink);opacity:1}
.mapctl button[aria-pressed="true"]#zloc{background:#FFD21F;color:#3B2A00}
.roads{pointer-events:none}
#app[data-roads="0"] .roads{display:none}
.rd-c,.rd-f{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rd-c{stroke:var(--road-case);stroke-width:5}
.rd-f{stroke:var(--road);stroke-width:3}
.ls .sh-b{fill:#26465F;stroke:#fff;stroke-width:1.2px}
.ls .sh-t{fill:#fff;stroke:none;font-size:9px;font-weight:700;letter-spacing:.02em}
.mapctl button[aria-pressed="false"]{color:var(--muted);opacity:.7}
.sr-c,.sr-f,.rd-d{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.sr-c{stroke:var(--road-case);stroke-width:3.6}
.sr-f{stroke:var(--road);stroke-width:2.1}
.rd-d{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 5}
.ls .rd-p{fill:var(--accent);stroke:#fff;stroke-width:1.6px}
.lr-c,.lr-f{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.lr-c{stroke:var(--road-case);stroke-width:2.1;opacity:.9}
.lr-f{stroke:var(--road);stroke-width:1}
#app[data-mode="lake"] .sroads,#app[data-mode="lake"] .sideroads{display:none}
.sr-l{display:none}
svg[data-hi="1"] .sr-l,.sr-l.sel{display:inline}
.ls .sr-t{font-size:9.5px;font-weight:600;letter-spacing:.01em;text-anchor:middle}
.scale{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 9px 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.scale .bar{height:5px;border:1.5px solid var(--ink);border-top:0;opacity:.75}
.north{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.north svg{width:18px;height:18px}
.note{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--card) 80%,transparent);padding:3px 8px;border-radius:6px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 100px);width:max-content}
.banner button{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:999px;padding:6px 12px;font-weight:700}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pscroll{overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.phead h2{font-size:18px;font-weight:800;flex:1}
.phead .sub{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 16px;border-top:1px solid var(--line)}
.row:hover{background:var(--field)}
.row[aria-current="true"]{background:var(--field);box-shadow:inset 3px 0 0 var(--c)}
.tile{width:56px;height:56px;border-radius:10px;flex:none;background:var(--c);color:#fff;display:grid;place-items:center;font-size:24px;overflow:hidden;position:relative}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.rt{min-width:0;flex:1}
.rt b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt span{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);}
.empty{padding:28px 22px;color:var(--muted);text-align:center}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}

.hero{position:relative;background:var(--c);color:#fff;aspect-ratio:16/10;overflow:hidden}
.hero .strip{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero .strip::-webkit-scrollbar{display:none}
.hero .strip img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.hero .cover{height:100%;display:grid;place-items:center;font-size:72px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 14px,transparent 14px 28px),var(--c)}
.hero .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.hero .back{position:absolute;left:10px;top:10px;height:32px;padding:0 12px 0 8px;border-radius:999px;border:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.hero .back svg{width:16px;height:16px}
.dbody{padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.dbody h2{font-size:26px;font-weight:800;line-height:1.08}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--field);border:1px solid var(--line)}
.pill.up{background:#E1F4E8;color:#14633A;border-color:#B5E0C4}
.pill.past{color:var(--muted)}
.pill.sample{background:#FFF0C8;color:#7A5300;border-color:#EBD08A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.up{background:#14392A;color:#8EE0B0;border-color:#1F5A3F}:root:not([data-theme="light"]) .pill.sample{background:#3B2F0C;color:#F0CD7A;border-color:#5C4A16}}
:root[data-theme="dark"] .pill.up{background:#14392A;color:#8EE0B0;border-color:#1F5A3F}
:root[data-theme="dark"] .pill.sample{background:#3B2F0C;color:#F0CD7A;border-color:#5C4A16}
.desc{margin:0;white-space:pre-wrap;max-width:65ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.facts dt{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
.facts dd{margin:0}
.facts a{color:var(--focus);font-weight:500}
.menu{border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px;background:var(--field)}
.menu h3{font-size:14px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.mi{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.mi i{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-3px);min-width:12px}
.mi span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.meta{color:var(--muted);font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* form */
.form{padding:0 16px 18px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld input[type=text],.fld input[type=tel],.fld input[type=number],.fld input[type=date],.fld input[type=datetime-local],.fld textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px}
.fld textarea{min-height:84px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--field);border-radius:999px;padding:4px 11px 4px 4px;font-weight:500;font-size:13px}
.cats .bd{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px}
.cats button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow{display:grid;grid-template-columns:1fr 96px 34px;gap:6px;margin-bottom:6px}
.mrow button{border:1px solid var(--line);background:var(--field);border-radius:10px;font-size:18px;line-height:1}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:88px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1;padding:0}
.addph{width:88px;height:66px;border-radius:9px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:12px;display:grid;place-items:center;text-align:center;padding:4px}
.loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--field);border:1px solid var(--line)}
.loc span{flex:1;font-size:13px}
.err{color:#B3261E;font-weight:500;margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err,:root:not([data-theme="light"]) .btn.danger{color:#FF9C90}}
:root[data-theme="dark"] .err,:root[data-theme="dark"] .btn.danger{color:#FF9C90}
.fbar{position:sticky;bottom:0;background:var(--card);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

/* lake conditions */
.wx{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.wxh{display:flex;align-items:center;gap:2px 14px;flex-wrap:wrap;width:100%;padding:9px 14px;border:0;background:transparent;text-align:left;border-radius:16px}
.wxt{display:inline-flex;align-items:center;gap:8px;font:800 16px var(--display);letter-spacing:-.01em}
.wxt .gl{color:var(--water-text);font-size:18px}
.wxs{font-size:13px}
.wxs b{font-weight:700;font-variant-numeric:tabular-nums}
.wxa{margin-left:auto;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.wxa .pill{font-size:11px;padding:1px 8px}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .2s;order:9;margin-left:-6px}
.wx[data-open="0"] .chev{transform:rotate(-90deg)}
.wxbody{padding:0 14px 10px}
.wxcards{display:flex;gap:10px;overflow-x:auto;padding:2px 1px 6px;scroll-snap-type:x proximity;scrollbar-width:thin}
.wxc{flex:1 1 200px;min-width:200px;max-width:330px;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:9px 12px 10px}
.wxc:hover{border-color:var(--water-deep)}
.wxn{font:800 14.5px var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;justify-content:space-between}
.wnow{display:flex;align-items:center;gap:8px}
.wnow .gl{font-size:26px;color:var(--water-text)}
.wnow b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.wnow span{color:var(--muted);font-size:12px;line-height:1.15}
.wmeta{color:var(--muted);font-size:12px}
.wwater{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--water-text);background:color-mix(in srgb,var(--water) 26%,transparent);border-radius:999px;padding:2px 9px 2px 7px;white-space:nowrap}
.wwater .gl{font-size:12px}
.wfc{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px dashed var(--line);padding-top:6px}
.wfc div{display:flex;flex-direction:column;gap:0;font-size:11px;color:var(--muted);min-width:0;line-height:1.3}
.wfc b{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.wfc em{font-style:normal;display:inline-flex;align-items:center;gap:3px;color:var(--water-text);font-weight:500}
.wfc em .gl{font-size:10px}
.wxfoot{margin:4px 2px 0;color:var(--muted);font-size:11.5px;max-width:120ch}
.wx[data-stale="1"] .wnow b{opacity:.6}


/* load screen */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;background:var(--w1);color:var(--head);transition:opacity .6s ease,transform .6s ease;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#splash.sp-out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-sky{position:absolute;left:0;right:0;top:0;height:64%;background:var(--scene) 30% bottom/cover no-repeat}
.sp-water{position:absolute;left:0;right:0;top:64%;bottom:0;background:linear-gradient(180deg,var(--w1),var(--w2));overflow:hidden}
.sp-water::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(100% + 240px);background:var(--ripples) 0 0/240px 60px repeat;opacity:var(--rip-o);animation:drift 38s linear infinite}
.sp-main{position:absolute;left:0;right:0;top:8%;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.sp-title{margin:0;font:800 clamp(22px,6.9vw,68px)/1.05 var(--display);letter-spacing:-.01em;white-space:nowrap;padding-bottom:1.5em;color:var(--head)}
.sp-l{display:inline-block;animation:spin .7s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes spin{from{opacity:0;transform:translateY(.55em) scale(.85)}}
#splash .badger{pointer-events:auto;cursor:pointer;animation:bobb 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#splash .badger.boop{animation:boop .6s ease}
#splash .badger:focus{outline:none}
#splash .badger:focus-visible{filter:drop-shadow(0 0 5px #fff)}
@keyframes bobb{50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes boop{0%{transform:translateX(-50%) scale(1) rotate(0)}30%{transform:translateX(-50%) scale(1.32) rotate(-11deg)}60%{transform:translateX(-50%) scale(1.14) rotate(8deg)}100%{transform:translateX(-50%) scale(1) rotate(0)}}
.sp-sayw{position:absolute;left:50%;top:calc(100% + 1.35em);width:0;height:0;pointer-events:none}
.sp-say{position:absolute;left:0;top:0;translate:-50% 0;background:#fff;color:#0F3B4C;font:700 13px var(--body);padding:5px 11px;border-radius:12px;box-shadow:0 2px 8px rgba(0,30,50,.3);white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none}
.sp-say.on{opacity:1;transform:none}
.sp-bottom{position:absolute;left:0;right:0;top:64%;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:0 24px calc(16px + env(safe-area-inset-bottom,0px))}
.sp-line{margin:0;font:700 17px var(--body);color:#fff;text-shadow:0 1px 4px rgba(0,35,60,.6);min-height:1.4em;text-align:center}
.sp-track{position:relative;width:min(560px,100%);height:14px;margin-top:20px;border-radius:999px;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.sp-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#FFE58A,#FFD21F)}
.sp-sail{position:absolute;left:0;top:-27px;width:38px;height:32px;margin-left:-19px;pointer-events:none;overflow:visible}
.sp-foot{width:min(560px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;font:600 13px var(--body);text-shadow:0 1px 3px rgba(0,35,60,.6)}
.sp-foot b{font-variant-numeric:tabular-nums;font-weight:800;min-width:3ch}
.sp-hint{flex:1;text-align:center}
#spskip{height:30px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:13px}
#spskip:hover{background:rgba(255,255,255,.34)}
.sp-rip{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.95);border-radius:50%;pointer-events:none;animation:rip 1.1s ease-out forwards;z-index:2}
@keyframes rip{to{transform:scale(10);opacity:0}}

/* mode switch + cabins & stays */
.modes{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.modes button{height:32px;padding:0 13px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.modes .gl{font-size:16px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#app[data-mode="stays"] .mapwrap{--land:#E7E3D6;--ring:#D5CFBB;--map-text:#5A5340;--road-case:#BDB6A2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app[data-mode="stays"] .mapwrap{--land:#25261F;--ring:#363829;--map-text:#C6C4A6;--road:#48493B;--road-case:#15160F}}
:root[data-theme="dark"] #app[data-mode="stays"] .mapwrap{--land:#25261F;--ring:#363829;--map-text:#C6C4A6;--road:#48493B;--road-case:#15160F}
a.btn{color:var(--ink);text-decoration:none}
.btn.big{height:48px;font-size:15px;width:100%}
.filt{padding:2px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid var(--line)}
.filt .fld{gap:3px;min-width:0}
.filt .fld input{height:36px;padding:0 9px}
.filt .fact{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0}
.filt .fact p{margin:0}
.price{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.price small{font:500 14px var(--body);color:var(--muted)}
.ranges{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.rng{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.rng.hit{background:#E1F4E8;color:#14633A;border-color:#B5E0C4;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rng.hit{background:#14392A;color:#8EE0B0;border-color:#1F5A3F}}
:root[data-theme="dark"] .rng.hit{background:#14392A;color:#8EE0B0;border-color:#1F5A3F}
.route{margin:0 0 8px}
.hint{color:var(--muted);font-size:12px;margin:0}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rrow{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;margin-bottom:6px;align-items:center}
.rrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px 9px;height:38px}
.rrow button{border:1px solid var(--line);background:var(--field);border-radius:10px;font-size:18px;line-height:1;height:38px}
.rrow.rhead{margin-bottom:2px;color:var(--muted);font-size:12px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:50;max-width:min(92vw,460px);font-weight:500}
.tabs{display:none}

@media (max-width:899px){
  body{padding-block:8px}
  .brand small{display:none}
  .spacer{display:none}
  .brand{order:1;flex:1 1 220px}
  .brand h1{font-size:16px;white-space:nowrap}
  .lockup{padding-bottom:26px}
  .mark{width:32px;height:32px;border-radius:10px}
  .mark svg{width:20px;height:20px}
  .viewer{order:2}
  .viewer b{display:none}
  .modes{order:3;flex:1 1 100%;display:flex}
  .modes button{flex:1;justify-content:center}
  .search{order:4;flex:1 1 0;min-width:0}
  .add{order:5;flex:none;padding:0 14px}
  #app{grid-template-rows:auto auto minmax(0,1fr) auto auto}
  .wxc{flex-basis:226px;min-width:226px}
  .wxh{padding:8px 12px}
  .wxt{font-size:15px;flex:1}
  .chev{order:1;margin-left:0}
  .wxs,.wxa{order:2;flex-basis:100%;margin-left:0}
  .wxbody{padding:0 12px 8px;max-height:36vh;overflow-y:auto;overscroll-behavior:contain}
  .stage{display:block;position:relative}
  .mapwrap{position:absolute;inset:0}
  .stage{overflow:hidden;border-radius:16px}

/* badger jet ski game */
.lockup .badger{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease}
.lockup .badger:hover{transform:translateX(-50%) scale(1.1) rotate(-4deg)}
.lockup .badger:active{transform:translateX(-50%) scale(.95)}
.lockup .badger:focus{outline:none}
.lockup .badger:focus-visible{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px var(--focus))}
#game{position:fixed;inset:0;z-index:90;background:#6EC1EC;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;outline:none}
#game:not([hidden]) ~ .toast{z-index:95}

.g-btn{pointer-events:auto;cursor:pointer}
.g-right{display:flex;align-items:center;gap:6px}
.g-btn.snd{width:36px;padding:0;justify-content:center}
.g-btn.snd svg{width:20px;height:20px;display:block;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill-rule:nonzero}
.g-btn.snd .wv,.g-btn.snd .x{fill:none}
.g-btn.snd.off .wv{display:none}
.g-btn.snd:not(.off) .x{display:none}
.g-btn:hover{background:var(--card)}
.g-pill b{font-variant-numeric:tabular-nums;font-weight:800}
.g-pill svg.gi{width:32px;height:22px;display:block}
.g-hearts{gap:3px;padding:0 10px}
.g-heart{width:18px;height:18px;display:block;fill:#E5533D;stroke:#7F2416;stroke-width:1.2}
.g-heart.off{fill:rgba(20,50,70,.18);stroke:rgba(20,50,70,.3)}
.g-banner{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;width:max-content;max-width:min(92vw,420px);padding:8px 16px 8px 8px;border-radius:16px;background:var(--card);border:2px solid #E0A800;box-shadow:var(--shadow);animation:gpop .4s cubic-bezier(.2,.9,.3,1.3)}

    if (n % 5 === 0) track.setAttribute('aria-valuenow', n);
    var k = 0; for (var i = 0; i < LINES.length; i++){ if (p >= LINES[i][0]) k = i; }
    if (k !== lastLine){ lastLine = k; line.textContent = LINES[k][1]; }
  }
  function finish(fast){
    if (finished) return; finished = true;
    update(1); line.textContent = 'Welcome aboard!';
    var app = document.getElementById('app'); 
    var done = function(){ if (el.parentNode) el.parentNode.removeChild(el); if (app) app.removeAttribute('inert'); };
    setTimeout(function(){ el.classList.add('sp-out'); setTimeout(done, fast ? 0 : 650); }, fast ? 0 : 450);
  }
  function frame(now){
    if (finished) return;
    var p = Math.min(1, (now - t0) / D); update(p);
    if (p >= 1) finish(false); else requestAnimationFrame(frame);
  }
  $('spskip').addEventListener('click', function(){ finish(true); });
  window.__splashDone = function(){ return finished; };
  build();
  var app0 = document.getElementById('app'); if (app0) app0.setAttribute('inert', '');
  document.addEventListener('DOMContentLoaded', function(){ var a = document.getElementById('app'); if (a && !finished) a.setAttribute('inert', ''); });
  requestAnimationFrame(frame);
  setTimeout(function(){ finish(false); }, D + 1500);
})();
</script>
