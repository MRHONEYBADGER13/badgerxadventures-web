<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BADGERxADVENTURES — Lake Cumberland</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">BADGERxADVENTURES</div>
  <nav>
    <a href="/login">Owner login</a>
    <a href="/redeem" class="primary">Have a code?</a>
  </nav>
</header>
<div class="map-wrap">
  <svg id="map"></svg>
  <div class="legend">
    <div class="row"><span class="dot" style="background:#C2410C"></span> Business</div>
    <div class="row"><span class="dot" style="background:#0E7C86"></span> Cabin / Stay</div>
    <div class="row"><span class="dot" style="background:#6D28D9"></span> Custom</div>
  </div>
  <div class="card-panel" id="card" hidden></div>
</div>
<script src="/static/map.js"></script>
<script>
(async function(){
  const [mapdata, pins] = await Promise.all([
    fetch('/static/mapdata.json').then(r => r.json()),
    fetch('/api/pins').then(r => r.json()),
  ]);
  const map = new LakeMap(document.getElementById('map'), mapdata);
  const card = document.getElementById('card');

  function showCard(p){
    const photos = (p.photos||[]).map(src => `<img src="${src}">`).join('');
    const avail = (p.availability||[]).map(a => `<div>${a.from} → ${a.to}</div>`).join('') || '<div style="color:var(--muted)">No dates posted</div>';
    card.innerHTML = `
      <button class="close" onclick="this.parentElement.hidden=true">×</button>
      <div class="kind">${PIN_LABEL[p.pin_type]||''}</div>
      <h3>${p.title}</h3>
      ${p.address ? `<div style="color:var(--muted);font-size:13px">${p.address}</div>` : ''}
      ${p.phone ? `<div style="font-size:13px;margin-top:4px">📞 ${p.phone}</div>` : ''}
      ${p.description ? `<p style="font-size:14px">${p.description}</p>` : ''}
      ${photos ? `<div class="photos">${photos}</div>` : ''}
      ${p.events ? `<div style="margin-top:8px"><b style="font-size:13px">Happening soon</b><p style="font-size:13px">${p.events}</p></div>` : ''}
      ${p.pin_type === 'stay' ? `<div style="margin-top:8px"><b style="font-size:13px">Availability</b>${avail}</div>` : ''}
    `;
    card.hidden = false;
  }

  map.renderPins(pins, { onClick: showCard });
})();
</script>
</body>
</html>
