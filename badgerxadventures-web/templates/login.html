<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner login — BADGERxADVENTURES</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="brand">BADGERxADVEN<span class="th">TU<svg class="badger-mark" viewBox="1 1.5 30 23" aria-hidden="true" focusable="false"><circle cx="7" cy="6.5" r="3.6" fill="#1B1B1B" stroke="currentColor" stroke-width="1"/><circle cx="25" cy="6.5" r="3.6" fill="#1B1B1B" stroke="currentColor" stroke-width="1"/><circle cx="6.6" cy="5.6" r="1.4" fill="#fff"/><circle cx="25.4" cy="5.6" r="1.4" fill="#fff"/><ellipse cx="16" cy="13.5" rx="11" ry="9.3" fill="#fff" stroke="currentColor" stroke-width="1"/><path d="M7 7.5C9.5 5.5 12 7 12.6 10L14 20.5C11 20.5 8 18 6.6 14 5.6 11 6 9 7 7.5z" fill="#1B1B1B"/><path d="M25 7.5C22.5 5.5 20 7 19.4 10L18 20.5C21 20.5 24 18 25.4 14 26.4 11 26 9 25 7.5z" fill="#1B1B1B"/><circle cx="10.6" cy="11.6" r="1" fill="#fff"/><circle cx="21.4" cy="11.6" r="1" fill="#fff"/><ellipse cx="16" cy="19.4" rx="2.3" ry="1.6" fill="#1B1B1B"/></svg></span>RES</div><nav><a href="/">Back to map</a></nav></header>
<div class="center-form">
  <h2>Log in</h2>
  <form id="f">
    <label>Email</label>
    <input name="email" type="email" required>
    <label>Password</label>
    <div class="pw-field">
      <input name="password" type="password" required>
      <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false"></button>
    </div>
  </form>
  <button form="f">Log in</button>
  <div class="error-msg" id="err" hidden></div>
  <a class="muted-link" href="/forgot-password">Forgot your password?</a>
  <a class="muted-link" href="/redeem">Have a code instead? Redeem it</a>
</div>
<script>
const EYE_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.1 21.1 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.1 21.1 0 0 1-2.52 3.71M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
document.querySelectorAll('.pw-toggle').forEach(btn => {
  const input = btn.previousElementSibling;
  btn.innerHTML = EYE_SVG;
  btn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.innerHTML = show ? EYE_OFF_SVG : EYE_SVG;
  });
});
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.hidden = true;
  const fd = new FormData(e.target);
  const res = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email: fd.get('email'), password: fd.get('password')})
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Something went wrong.'; err.hidden = false; return; }
  location.href = '/';
});
</script>
</body>
</html>
