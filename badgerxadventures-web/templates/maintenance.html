<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BADGERxADVENTURES</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#E5533D">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}" type="image/png">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAF6F7; --card:#FFFEFA; --ink:#0F3B4C; --muted:#4A7282; --line:#D3E4E6;
  --water:#7CC6DE; --water-deep:#4BA8CB; --shore:#3792B8;
  --accent:#E5533D; --accent-ink:#FFFFFF; --shadow:0 1px 2px rgba(19,48,46,.12),0 8px 24px rgba(19,48,46,.10);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A1B2A; --card:#11293A; --ink:#EAF3F4; --muted:#9DBAC4; --line:#22425A;
    --water:#245F80; --water-deep:#184A66; --shore:#4796BA;
    --accent:#FF7A60; --accent-ink:#1A0E0B; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font:15px/1.5 var(--body);
  color:var(--ink);
  background:
    radial-gradient(ellipse 900px 500px at 50% -8%, color-mix(in srgb, var(--water) 35%, transparent), transparent 60%),
    var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100%;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));
  text-align:center;
  overflow-x:hidden;
}
img,svg{max-width:100%}
.wrap{max-width:460px;width:100%}
.eyebrow{
  font:800 11px/1 var(--body);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--shore);
  margin:0 0 18px;
}
.stage{
  position:relative;
  width:min(78vw,300px);
  margin:0 auto 22px;
}
.ripples{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:88%}
.ripples ellipse{fill:none;stroke:var(--shore);stroke-width:2;opacity:.35}
.ripples ellipse:nth-child(2){opacity:.22}
.ripples ellipse:nth-child(3){opacity:.12}
.boat{position:relative;filter:drop-shadow(0 10px 14px rgba(15,59,76,.18));animation:bob 2.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.boat{animation:none}.ripples ellipse{animation:none}}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-1.2deg)}
  50%{transform:translateY(-7px) rotate(1.2deg)}
}
@keyframes ripple{
  0%{transform:scale(.85);opacity:.4}
  100%{transform:scale(1.25);opacity:0}
}
.ripples ellipse{animation:ripple 2.8s ease-out infinite}
.ripples ellipse:nth-child(2){animation-delay:.5s}
.ripples ellipse:nth-child(3){animation-delay:1s}
h1{
  font-family:var(--display);
  font-weight:800;
  letter-spacing:-.01em;
  font-size:clamp(21px,5.2vw,27px);
  margin:0 0 10px;
  text-wrap:balance;
}
p.sub{
  font-size:15.5px;
  color:var(--muted);
  margin:0 0 26px;
  text-wrap:balance;
}
p.sub b{color:var(--ink);font-weight:700}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button.retry{
  font:700 14px var(--body);
  color:var(--accent-ink);
  background:var(--accent);
  border:0;
  border-radius:999px;
  padding:12px 22px;
  cursor:pointer;
  box-shadow:var(--shadow);
}
button.retry:active{transform:translateY(1px)}
.sig{
  margin-top:28px;
  font-size:12.5px;
  color:var(--muted);
  opacity:.8;
}
</style>
</head><body>
<div class="wrap">
  <p class="eyebrow">BADGERxADVENTURES</p>
  <div class="stage">
    <svg class="ripples" viewBox="0 0 120 20" aria-hidden="true">
      <ellipse cx="60" cy="10" rx="50" ry="6"/>
      <ellipse cx="60" cy="10" rx="50" ry="6"/>
      <ellipse cx="60" cy="10" rx="50" ry="6"/>
    </svg>
    <svg class="boat" viewBox="0 0 120 72" role="img" aria-label="A badger in a life jacket, zooming across the lake on a jet boat">
      <circle cx="4.5" cy="52" r="3.2" fill="#fff" opacity="0.9"/>
      <circle cx="2.2" cy="46.5" r="2.2" fill="#fff" opacity="0.8"/>
      <circle cx="6.5" cy="44" r="1.6" fill="#fff" opacity="0.75"/>
      <path d="M9 50L113 44Q108 55 96 59Q80 62.5 60 62.5L24 62.5Q11 62 9 50Z" fill="#2B343A" stroke="#11181B" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 58.5L98 55" stroke="#5C6B73" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <path d="M7 49Q6 44 12 43.5L25 42L28 36.5Q46 32 67 35L71 30Q75 24.5 82 26.5Q88 28.5 91 34Q105 36 118 43Q108 48 96 50L14 52Q7.5 52.5 7 49Z" fill="#E5533D" stroke="#7F2416" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 49Q52 47 93 44.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M95 39.5Q106 40.5 114 43" stroke="#F2A21A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M9 46L24 44.5" stroke="#23282B" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M26 40Q28 35 46 33.5Q60 33 68 36L70 41L26 43Z" fill="#23282B" stroke="#0E1113" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M77 32L80 20" stroke="#4A5A63" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M84 32Q86 23 95 27L97 33Z" fill="rgba(200,238,252,.62)" stroke="#7FA9B5" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M74 18.5L88 16.5" stroke="#23282B" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M86.5 16.7L89 16.3" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M33 40Q33 26 46 24.5Q58 24 62 32.5L66 39Z" fill="#F2A21A" stroke="#8A5A00" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M39 31L58 33" stroke="#8A5A00" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
      <path d="M56 30Q68 27 79 19.5" stroke="#23282B" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="80.5" cy="18.8" r="3" fill="#fff" stroke="#1B1B1B" stroke-width="1"/>
      <g transform="translate(29 -3) scale(1.3)">
        <circle cx="7" cy="6.5" r="3.6" fill="#1B1B1B" stroke="#1B1B1B" stroke-width="1"/>
        <circle cx="25" cy="6.5" r="3.6" fill="#1B1B1B" stroke="#1B1B1B" stroke-width="1"/>
        <circle cx="6.6" cy="5.6" r="1.4" fill="#fff"/>
        <circle cx="25.4" cy="5.6" r="1.4" fill="#fff"/>
        <ellipse cx="16" cy="13.5" rx="11" ry="9.3" fill="#fff" stroke="#1B1B1B" stroke-width="1"/>
        <path d="M7 7.5C9.5 5.5 12 7 12.6 10L14 20.5C11 20.5 8 18 6.6 14 5.6 11 6 9 7 7.5z" fill="#1B1B1B"/>
        <path d="M25 7.5C22.5 5.5 20 7 19.4 10L18 20.5C21 20.5 24 18 25.4 14 26.4 11 26 9 25 7.5z" fill="#1B1B1B"/>
        <circle cx="10.6" cy="11.6" r="1" fill="#fff"/>
        <circle cx="21.4" cy="11.6" r="1" fill="#fff"/>
        <ellipse cx="16" cy="19.4" rx="2.3" ry="1.6" fill="#1B1B1B"/>
      </g>
    </svg>
  </div>
  <h1>Sorry, BadgerXAdventures is unavailable.</h1>
  <p class="sub">Check back later&hellip; <b>or we're just pushing out an epic update!!!</b></p>
  <div class="actions">
    <button type="button" class="retry" onclick="location.reload()">Try again</button>
  </div>
  <p class="sig">&mdash; the badger</p>
</div>
</body></html>
