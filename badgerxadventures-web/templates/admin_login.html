<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login — BADGERxADVENTURES</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="brand">BADGERxADVEN<span class="th">TU<svg class="badger-mark" viewBox="1 1.5 30 23" aria-hidden="true" focusable="false"><circle cx="7" cy="6.5" r="3.6" fill="#1B1B1B" stroke="currentColor" stroke-width="1"/><circle cx="25" cy="6.5" r="3.6" fill="#1B1B1B" stroke="currentColor" stroke-width="1"/><circle cx="6.6" cy="5.6" r="1.4" fill="#fff"/><circle cx="25.4" cy="5.6" r="1.4" fill="#fff"/><ellipse cx="16" cy="13.5" rx="11" ry="9.3" fill="#fff" stroke="currentColor" stroke-width="1"/><path d="M7 7.5C9.5 5.5 12 7 12.6 10L14 20.5C11 20.5 8 18 6.6 14 5.6 11 6 9 7 7.5z" fill="#1B1B1B"/><path d="M25 7.5C22.5 5.5 20 7 19.4 10L18 20.5C21 20.5 24 18 25.4 14 26.4 11 26 9 25 7.5z" fill="#1B1B1B"/><circle cx="10.6" cy="11.6" r="1" fill="#fff"/><circle cx="21.4" cy="11.6" r="1" fill="#fff"/><ellipse cx="16" cy="19.4" rx="2.3" ry="1.6" fill="#1B1B1B"/></svg></span>RES admin</div><nav><a href="/">Back to map</a></nav></header>
<div class="center-form">
  <h2>Admin login</h2>
  <form id="f">
    <label>Email</label>
    <input name="email" type="email" required>
    <label>Password</label>
    <input name="password" type="password" required>
  </form>
  <button form="f">Log in</button>
  <div class="error-msg" id="err" hidden></div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.hidden = true;
  const fd = new FormData(e.target);
  const res = await fetch('/api/admin/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email: fd.get('email'), password: fd.get('password')})
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Something went wrong.'; err.hidden = false; return; }
  location.href = '/admin';
});
</script>
</body>
</html>
