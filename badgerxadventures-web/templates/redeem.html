<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redeem your code — BADGERxADVENTURES</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="brand">BADGERxADVENTURES</div><nav><a href="/">Back to map</a></nav></header>
<div class="center-form">
  <h2>Redeem your code</h2>
  <p style="color:var(--muted);font-size:14px">Enter the code you were given, then set up your login. You'll place your one pin next.</p>
  <form id="f">
    <label>Invite code</label>
    <input name="code" placeholder="ABCD-EFGH" required>
    <label>Email</label>
    <input name="email" type="email" required>
    <label>Password</label>
    <input name="password" type="password" minlength="8" required>
  </form>
  <button form="f">Continue</button>
  <div class="error-msg" id="err" hidden></div>
  <a class="muted-link" href="/login">Already have an account? Log in</a>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.hidden = true;
  const fd = new FormData(e.target);
  const res = await fetch('/api/redeem', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({code: fd.get('code'), email: fd.get('email'), password: fd.get('password')})
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Something went wrong.'; err.hidden = false; return; }
  location.href = '/';
});
</script>
</body>
</html>
