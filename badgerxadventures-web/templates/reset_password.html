<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — BADGERxADVENTURES</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="brand">BADGERxADVENTURES</div><nav><a href="/">Back to map</a></nav></header>
<div class="center-form">
  <h2>Set a new password</h2>
  <form id="f">
    <label>New password</label>
    <div class="pw-field">
      <input name="password" type="password" minlength="8" required>
      <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false"></button>
    </div>
    <label>Confirm password</label>
    <div class="pw-field">
      <input name="confirm" type="password" minlength="8" required>
      <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false"></button>
    </div>
  </form>
  <button form="f" id="submitBtn">Set password</button>
  <div class="error-msg" id="err" hidden></div>
  <div class="ok-msg" id="ok" hidden></div>
</div>
<script>
const EYE_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.1 21.1 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.1 21.1 0 0 1-2.52 3.71M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
document.querySelectorAll('.pw-toggle').forEach(btn => {
  const input = btn.previousElementSibling;
  btn.innerHTML = EYE_SVG;
  btn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.innerHTML = show ? EYE_OFF_SVG : EYE_SVG;
  });
});
const token = new URLSearchParams(location.search).get('token') || '';
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.hidden = true;
  const ok = document.getElementById('ok'); ok.hidden = true;
  const fd = new FormData(e.target);
  const password = fd.get('password');
  if (!token) {
    err.textContent = "This link is missing its token -- ask an admin to send a new one.";
    err.hidden = false;
    return;
  }
  if (password !== fd.get('confirm')) {
    err.textContent = "Passwords don't match.";
    err.hidden = false;
    return;
  }
  const res = await fetch('/api/reset-password', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({token, password})
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Something went wrong.'; err.hidden = false; return; }
  document.getElementById('f').hidden = true;
  document.getElementById('submitBtn').hidden = true;
  ok.textContent = 'Password updated. Taking you to log in…';
  ok.hidden = false;
  setTimeout(() => { location.href = '/login'; }, 1500);
});
</script>
</body>
</html>
