<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — BADGERxADVENTURES</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="brand">BADGERxADVENTURES</div><nav><a href="/">Back to map</a></nav></header>
<div class="center-form">
  <h2>Forgot your password?</h2>
  <p style="font-size:13px;color:var(--muted);margin-top:-6px">
    Enter the email on your account and we'll send you a link to set a new password.
  </p>
  <form id="f">
    <label>Email</label>
    <input name="email" type="email" required>
  </form>
  <button form="f" id="submitBtn">Send reset link</button>
  <div class="ok-msg" id="ok" hidden></div>
  <a class="muted-link" href="/login">Back to log in</a>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  await fetch('/api/forgot-password', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email: fd.get('email')})
  });
  // Always show the same message, whether or not that email has an
  // account -- so this page can't be used to find out who's registered.
  document.getElementById('f').hidden = true;
  document.getElementById('submitBtn').hidden = true;
  const ok = document.getElementById('ok');
  ok.textContent = "If that email has an account, we've sent a link to reset the password. Check your inbox (and spam folder).";
  ok.hidden = false;
});
</script>
</body>
</html>
